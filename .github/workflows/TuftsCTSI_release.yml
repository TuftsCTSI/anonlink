name: TuftsCTSI release
run-name: Wheels for ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
        env:
          CIBW_BUILD: "cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *i686"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64 x86_64
          # Bundle the C++ runtime that the extensions import: Python ships
          # VCRUNTIME140 but not MSVCP140, so without it a Windows machine
          # lacking the Visual C++ Redistributable fails to load _dice
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-dll msvcp140.dll -w {dest_dir} {wheel}
          # Each wheel imports with compiled Dice comparison
          CIBW_TEST_COMMAND: >-
            python -c "import anonlink; from anonlink.similarities import dice_coefficient_accelerated"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # On a version tag, publish a release with the wheels. Published releases are
  # immutable, so the release is built as a draft and published last.
  release:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Attest the wheels' build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl

      - name: Check that the tag has no published release
        run: |
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$DRAFT" != true ]; then
              echo "$TAG is already published, and a published release can't be changed"
              exit 1
            fi
            echo "Deleting the draft left by an earlier run"
            gh release delete "$TAG" --yes
          fi

      - name: Create a draft release with the wheels and their SHA-256
        run: |
          (cd dist && sha256sum *.whl > SHA256SUMS)
          gh release create "$TAG" --draft --verify-tag \
            --title "anonlink $TAG (TuftsCTSI)" \
            --notes "Wheels for CPython 3.14, for TuftsCTSI/pprl. Not published to PyPI." \
            dist/*.whl dist/SHA256SUMS

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
