name: TuftsCTSI release
run-name: Wheels for ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
        env:
          CIBW_BUILD: "cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *i686"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64 x86_64
          # Each wheel imports with compiled Dice comparison
          CIBW_TEST_COMMAND: >-
            python -c "import anonlink; from anonlink.similarities import dice_coefficient_accelerated"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  release:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Attach wheel and SHA-256 to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum *.whl > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS \
              --verify-tag --title "anonlink $GITHUB_REF_NAME (TuftsCTSI)" \
              --notes "Wheels for CPython 3.14, for TuftsCTSI/pprl. Not published to PyPI."
          fi
